name: Build Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build VB.NET Windows Forms application
        run: dotnet build src/NSRCGII.vbproj -c Release
      - name: Publish standalone Windows x64
        shell: pwsh
        run: ./publish-win-x64.ps1
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NSRCG-II-Windows-x64
          path: publish/
          if-no-files-found: error
