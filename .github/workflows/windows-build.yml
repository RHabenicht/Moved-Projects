name: Build Windows x64 and installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check legacy data and source
        shell: pwsh
        run: python tests/smoke_check.py
      - name: Build VB.NET Windows Forms application
        run: dotnet build src/NSRCGII.vbproj -c Release
      - name: Run VB.NET regression suite and WinForms smoke tests
        shell: pwsh
        run: dotnet run --project tests/NSRCGII.TestHarness.vbproj -c Release
      - name: Publish self-contained Windows x64 executable
        shell: pwsh
        run: ./publish-win-x64.ps1
      - name: Verify portable EXE launches into Windows desktop
        shell: pwsh
        run: ./tests/verify-windows-launch.ps1 -Executable ./publish/NSRCG-II.exe
      - name: Compile EXE setup with Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if (-not $compiler) {
            $compiler = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed ($LASTEXITCODE)" }
            $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) { throw "ISCC.exe was not found at $compiler" }
          [xml]$project = Get-Content src/NSRCGII.vbproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          $iss = Get-Content installer/NSRCG-II.iss -Raw
          if (-not $iss.Contains('#define MyAppVersion "' + $version + '"')) {
            throw "Installer version does not match the VB.NET project version"
          }
          & $compiler installer/NSRCG-II.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed ($LASTEXITCODE)" }
          if (-not (Get-ChildItem installer-output -Filter 'NSRCG-II-Setup-*-win-x64.exe')) {
            throw 'Installer EXE was not created'
          }
      - name: Test unattended install and uninstall on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem installer-output -Filter 'NSRCG-II-Setup-*-win-x64.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer not found' }
          $installDir = Join-Path $env:RUNNER_TEMP 'NSRCG-II-Installer-Smoke'
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="' + $installDir + '"'
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList $arguments -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Silent installer returned $($proc.ExitCode)" }
          $exe = Join-Path $installDir 'NSRCG-II.exe'
          if (-not (Test-Path $exe)) { throw "NSRCG-II.exe missing after installation" }
          & ./tests/verify-windows-launch.ps1 -Executable $exe
          $dataFiles = @(Get-ChildItem (Join-Path $installDir 'LegacyData') -File)
          if ($dataFiles.Count -lt 12) { throw "Expected 12 legacy data files; found $($dataFiles.Count)" }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstaller returned $($uninstall.ExitCode)" }
          if (Test-Path $exe) { throw 'Application EXE remained after uninstall' }
          Write-Host 'Installer smoke test passed: install, files, uninstall.'
      - name: Upload setup executable
        uses: actions/upload-artifact@v4
        with:
          name: NSRCG-II-Setup-EXE
          path: installer-output/NSRCG-II-Setup-*-win-x64.exe
          if-no-files-found: error
      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NSRCG-II-Windows-x64
          path: publish/
          if-no-files-found: error

  compatibility-win2022:
    name: Windows Server 2022 regression and EXE startup
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run VB.NET regression and WinForms tests
        shell: pwsh
        run: dotnet run --project tests/NSRCGII.TestHarness.vbproj -c Release
      - name: Publish Windows x64 EXE
        shell: pwsh
        run: ./publish-win-x64.ps1
      - name: Launch published EXE on Windows Server 2022
        shell: pwsh
        run: ./tests/verify-windows-launch.ps1 -Executable ./publish/NSRCG-II.exe
